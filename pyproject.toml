[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-creation"
version = "0.2.0"
description = "A survival game that asks how you will live your life."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Reniel Galang", email = "plaisolutionsph@gmail.com" }]

dependencies = [
    "arcade>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
build = [
    "pyinstaller>=6",
]

[project.scripts]
life-creation = "main:main"

[tool.setuptools]
packages = ["life_creation", "life_creation.presentation",
            "life_creation.presentation.views", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:life_creation.*"]
